name: Deploy documentation to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let an active deployment finish before publishing the newest queued version.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check documentation
        run: |
          python3 -m unittest scripts.test_check_docs
          python3 scripts/check_docs.py
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload documentation site
        uses: actions/upload-pages-artifact@v3
        with:
          # Publish only the ready-to-serve HTML documentation and its assets.
          path: docs/design-system
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
